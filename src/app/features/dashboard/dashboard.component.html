<mat-drawer-container class="dashboard-shell" autosize>
  <mat-drawer #drawer class="dashboard-sidenav" mode="side" opened>
    <div class="brand">
      <mat-icon>satellite_alt</mat-icon>
      <span>Reseller Panel</span>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let item of navItems$ | async"
        [routerLink]="item.path"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <a mat-list-item (click)="logout()" class="logout-item">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Cerrar sesión</span>
      </a>
    </div>
  </mat-drawer>

  <div class="dashboard-content">
    <mat-toolbar color="primary" class="dashboard-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="route-title">{{ currentRouteName }}</span>
      <span class="spacer"></span>
      <button
        mat-icon-button
        class="theme-toggle"
        (click)="theme.toggle()"
        [matTooltip]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"
        aria-label="Cambiar tema"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <div class="user-info" *ngIf="authUser$ | async as user">
        <mat-icon>person</mat-icon>
        <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
        <span class="user-role" *ngIf="roleLabel$ | async as roleLabel">{{ roleLabel }}</span>
      </div>
    </mat-toolbar>

    <main class="dashboard-main">
      <router-outlet />
    </main>
  </div>
</mat-drawer-container>
