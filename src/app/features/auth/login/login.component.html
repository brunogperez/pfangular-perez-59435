<section class="op-login">
  <header class="op-brand">
    <span class="op-dot"></span>
    <span class="op-name">RELAY</span>
    <span class="op-tag">RESELLER&nbsp;OPS</span>
  </header>

  <h1 class="op-title">Acceso a consola</h1>
  <p class="op-lead">Identificate para operar el panel.</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="op-form">
    <mat-form-field appearance="outline" class="op-field">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>alternate_email</mat-icon>
      <input matInput formControlName="email" autocomplete="username" />
      <mat-error>El email es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="op-field">
      <mat-label>Contraseña</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input matInput formControlName="password" [type]="passwordType" autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="togglePassword()" aria-label="Mostrar u ocultar contraseña">
        <mat-icon>{{ hideIcon }}</mat-icon>
      </button>
      <mat-error>La contraseña es requerida</mat-error>
    </mat-form-field>

    <div *ngIf="errorMessage$ | async as errorMessage" class="op-error" role="alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <button mat-flat-button color="primary" type="submit" class="op-submit"
            [disabled]="loading$ | async">
      <span *ngIf="!(loading$ | async)">Iniciar sesión</span>
      <span *ngIf="loading$ | async" class="op-loading">
        <mat-spinner diameter="18"></mat-spinner> Conectando…
      </span>
    </button>
  </form>

  <footer class="op-foot">
    <span class="op-led"></span> Sistema operativo · consola v2
  </footer>
</section>
